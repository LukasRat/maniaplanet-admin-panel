services:
  adminpanel:
    image: ghcr.io/lukasrat/maniaplanet-admin-panel:latest
    ports:
      # Format: "<host_port>:<container_port>"
      # Change the host port (left side) to expose on a different port, e.g. "3200:3200"
      - "${HTTP_PORT:-3100}:${HTTP_PORT:-3100}"
    environment:
      # Port the admin panel web server listens on inside the container
      - HTTP_PORT=${HTTP_PORT:-3100}
      # Hostname or IP of the ManiaPlanet game server's XML-RPC interface
      # "dedicated" resolves to the dedicated server container on the shared Docker network
      - RPC_HOST=${RPC_HOST:-dedicated}
      # XML-RPC port of the ManiaPlanet game server (e.g. 5001)
      - RPC_PORT=${RPC_PORT:-5000}
      # Path inside the container where ManiaPlanet maps are stored
      - MANIAPLANET_MAPS_DIR=${MANIAPLANET_MAPS_DIR:-/maps}
    volumes:
      # Bind-mount your ManiaPlanet server's UserData/Maps directory so map uploads work.
      # Replace the host path (left side) with the actual path on your host machine.
      # Example: - /home/user/maniaplanetserver/UserData/Maps:/maps
      - /path/to/maniaplanetserver/UserData/Maps:/maps
    networks:
      - xmlrpc-network
    restart: unless-stopped

# "xmlrpc-network" is the shared network defined in your main docker-compose.yml.
# Add the adminpanel service there directly, or reference the network as external:
#   networks:
#     xmlrpc-network:
#       external: true
# The RPC_HOST value must match the service name of your dedicated server (default: "dedicated").
networks:
  xmlrpc-network:
    external: true
