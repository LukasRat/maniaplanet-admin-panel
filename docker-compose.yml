services:
  maniaplanet-admin-panel:
    build: .
    container_name: maniaplanet-admin-panel
    ports:
      - "${HTTP_PORT:-3100}:${HTTP_PORT:-3100}"
    environment:
      # Application Configuration
      - HTTP_PORT=${HTTP_PORT:-3100}
      - HTTP_HOST=${HTTP_HOST:-0.0.0.0}
      # ManiaPlanet Server Connection
      - RPC_HOST=${RPC_HOST:-127.0.0.1}
      - RPC_PORT=${RPC_PORT:-5000}
      - RPC_LOGIN=${RPC_LOGIN:-SuperAdmin}
      # Maps Directory
      - MANIAPLANET_MAPS_DIR=${MANIAPLANET_MAPS_DIR:-/maps}
    volumes:
      # Mount your ManiaPlanet server's Maps directory here
      # Example: ./maniaplanet-server/UserData/Maps:/maps
      - maps-data:/maps
    restart: unless-stopped
    networks:
      - maniaplanet-network

  # Example: If your ManiaPlanet server is also running in Docker
  # Uncomment and configure this section if needed
  # maniaplanet-server:
  #   image: your-maniaplanet-server-image
  #   container_name: maniaplanet-server
  #   ports:
  #     - "5000:5000"  # XML-RPC port
  #     - "2350:2350"  # Game port
  #   volumes:
  #     - maps-data:/server/UserData/Maps
  #   networks:
  #     - maniaplanet-network

volumes:
  maps-data:

networks:
  maniaplanet-network:
    driver: bridge
