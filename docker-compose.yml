services:
  dedicated:
    # ManiaPlanet dedicated server – replace the image below with your own or a community image.
    # See https://hub.docker.com for available ManiaPlanet server images, or build your own.
    # The adminpanel service reaches it via the service name "dedicated" on the shared network.
    image: your-maniaplanet-dedicated-image
    # Expose the XML-RPC port if needed for external access; internal traffic uses the Docker network.
    # ports:
    #   - "5000:5000"
    networks:
      - maniaplanet
    restart: unless-stopped

  adminpanel:
    image: ghcr.io/lukasrat/maniaplanet-admin-panel:latest
    ports:
      # Format: "<host_port>:<container_port>"
      # Change the host port (left side) to expose on a different port, e.g. "3200:3200"
      - "${HTTP_PORT:-3100}:${HTTP_PORT:-3100}"
    environment:
      # Port the admin panel web server listens on inside the container
      - HTTP_PORT=${HTTP_PORT:-3100}
      # Hostname or IP of the ManiaPlanet game server's XML-RPC interface
      # "dedicated" resolves to the dedicated service container on the shared Docker network
      - RPC_HOST=${RPC_HOST:-dedicated}
      # XML-RPC port of the ManiaPlanet game server (e.g. 5001)
      - RPC_PORT=${RPC_PORT:-5000}
      # Path inside the container where ManiaPlanet maps are stored
      - MANIAPLANET_MAPS_DIR=${MANIAPLANET_MAPS_DIR:-/maps}
    volumes:
      # Mount your ManiaPlanet server's UserData/Maps directory here so map uploads work
      # Example: - /home/user/maniaplanetserver/UserData/Maps:/maps
      - maps_data:/maps
    networks:
      - maniaplanet
    depends_on:
      - dedicated
    restart: unless-stopped

networks:
  maniaplanet:

volumes:
  maps_data:
